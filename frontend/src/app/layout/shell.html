<mat-toolbar class="shell-toolbar">
  <app-brand-logo [size]="28" [wordmark]="true" />
  <span class="spacer"></span>
  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menu">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="menu-user" mat-menu-item disabled>{{ profile()?.name || 'Aluno(a)' }}</div>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sair</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="shell-content">
  <router-outlet />
</main>
